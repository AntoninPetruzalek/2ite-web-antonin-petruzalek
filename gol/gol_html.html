<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game of Life</title>
  <link rel="stylesheet" href="gol_css.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div id="theme-panel">
        <label>Změna barvy:</label>
        <button class="theme-btn" data-theme="yellow">Žlutá</button>
        <button class="theme-btn" data-theme="blue">Modrá</button>
        <button class="theme-btn" data-theme="green">Zelená</button>
        <button class="theme-btn" data-theme="red">Červená</button>
      </div>
         
  <h1>Conway's Game of Life</h1>
  <p>Klikni na buňky pro oživení, pak spusť simulaci.</p>

  <div id="controls">
    <button id="start">Start</button>
    <button id="stop">Stop</button>
    <button id="step">Krok</button>
    <button id="random">Náhodně</button>
    <button id="clear">Vymazat</button>
    <label>Rychlost:
      <input type="range" id="speed" min="50" max="1000" value="300">
    </label>
  </div>

  <div id="grid"></div>

  <div id="stars"></div>

  <script src="gol_javascript.js" defer></script>
</body>
</html>
