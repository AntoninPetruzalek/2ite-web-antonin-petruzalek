<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Jednoduché Game of Life</title>
<style>
  body { text-align:center; font-family:Arial; }
  canvas { border:1px solid #333; background:#fff; display:block; margin:20px auto; }
  button { padding:8px 16px; margin-top:10px; }
  #generation { font-weight:bold; margin-top:10px; }
</style>
</head>
<body>
<h1>Game of Life</h1>
<canvas id="board" width="200" height="200"></canvas>
<button id="start">Start</button>
<div id="generation">Generace: 0</div>

<script>
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const cellSize = 20; // 200px / 20px = 10 buněk na řádek
const cols = canvas.width / cellSize;
const rows = canvas.height / cellSize;
let grid = createRandomGrid(rows, cols, 0.3); // 30% živých buněk
let running = false;
let timer = null;
let generation = 0;

draw();

document.getElementById("start").addEventListener("click", () => {
  running = !running;
  document.getElementById("start").textContent = running ? "Stop" : "Start";
  if (running) {
    timer = setInterval(() => {
      grid = nextGeneration(grid);
      generation++;
      updateGeneration();
      draw();
    }, 400); // rychlost 400 ms
  } else {
    clearInterval(timer);
  }
});

function updateGeneration() {
  document.getElementById("generation").textContent = "Generace: " + generation;
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle = "#ccc";
  for (let r=0;r<rows;r++) {
    for (let c=0;c<cols;c++) {
      ctx.strokeRect(c*cellSize, r*cellSize, cellSize, cellSize);
      if (grid[r][c]) {
        ctx.fillStyle = "black";
        ctx.fillRect(c*cellSize+1, r*cellSize+1, cellSize-2, cellSize-2);
      }
    }
  }
}

function nextGeneration(current) {
  const next = createGrid(rows, cols);
  for (let r=0;r<rows;r++) {
    for (let c=0;c<cols;c++) {
      const alive = current[r][c];
      const n = neighbors(current,r,c);
      next[r][c] = (!alive && n===3) || (alive && (n===2||n===3)) ? 1 : 0;
    }
  }
  return next;
}

function neighbors(grid,r,c) {
  let count=0;
  for (let dr=-1;dr<=1;dr++) {
    for (let dc=-1;dc<=1;dc++) {
      if (dr===0 && dc===0) continue;
      const rr=r+dr, cc=c+dc;
      if (rr>=0 && rr<rows && cc>=0 && cc<cols) {
        count+=grid[rr][cc];
      }
    }
  }
  return count;
}

function createGrid(rows,cols) {
  return Array.from({length:rows},()=>Array(cols).fill(0));
}

function createRandomGrid(rows,cols,p=0.3) {
  return Array.from({length:rows},()=>Array.from({length:cols},()=>Math.random()<p?1:0));
}
</script>
</body>
</html>
